        <div class="centre body">
            <h1>Curriculum Vitae</h1>
            <p>You can view my CV below, or <a href="cv.pdf" download>download it as a PDF</a>.</p>

            <script type="module">
                // pdf.js is pinned to a fixed version so that upstream API changes can't break this page.
                import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

                const container = document.getElementById('pdfhere');
                try {
                    const pdf = await pdfjsLib.getDocument({ url: './cv.pdf' }).promise;
                    for (let n = 1; n <= pdf.numPages; n++) {
                        const page = await pdf.getPage(n);
                        const viewport = page.getViewport({ scale: 2 });
                        const canvas = document.createElement('canvas');
                        canvas.style.display = 'block';
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        container.appendChild(canvas);
                        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    }
                } catch (err) {
                    console.error(err);
                    container.innerHTML = '<p>The CV could not be displayed here. Please <a href="cv.pdf">open the PDF directly</a>.</p>';
                }
            </script>

        </div>
        <div class="centre body">
            <div id="pdfhere"></div>
            <p class="octo">🐙</p>
        </div>

    </body>
